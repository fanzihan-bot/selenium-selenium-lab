<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>iframe 与多窗口练习</title>
<style>
    body {
        font: 16px sans-serif;
        max-width: 760px;
        margin: 32px auto
    }

    iframe {
        width: 100%;
        height: 160px;
        border: 2px solid #69c
    }

    button {
        padding: 8px
    }
</style>
<h1>主页面</h1>
<p id="main-marker">当前位于主页面</p>
<h2>iframe 子页面</h2><iframe id="practice-frame" src="iframe_child.html" title="练习子页面"></iframe>
<h2>新窗口</h2><button id="open-window"
    onclick="window.open('child_window.html','seleniumPractice','width=560,height=360')">打开练习新窗口</button>
<p>打开后请从弹出的新窗口读取标题和文本，再返回原窗口。</p>

</html>
